name: npm-oidc-check
on:
  workflow_dispatch: {}
permissions:
  id-token: write
jobs:
  npm-oidc-check:
    runs-on: ubuntu-22.04
    environment: release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Print node and npm versions
        run: |
          node --version
          npm --version
      - name: Download v0.2.1 npm package
        run: |
          gh release download v0.2.1 --pattern 'chattrs-npm-package.tar.gz'
          mkdir -p pkg
          tar -xzf chattrs-npm-package.tar.gz -C pkg
          ls -R pkg | head -30
      - name: Publish npm package
        working-directory: pkg/package
        run: npm publish --access public --loglevel verbose
