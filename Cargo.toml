[package]
name = "chatterbox"
version = "0.1.0"
edition = "2021"
description = "Distributed client/server messaging for cross-agent coordination"
license = "MIT"
repository = "https://github.com/bolu-atx/chatter-box"
keywords = ["agents", "messaging", "cli"]
categories = ["command-line-utilities"]

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
