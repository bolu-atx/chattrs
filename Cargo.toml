[package]
name = "chattrs"
version = "0.2.0"
edition = "2021"
description = "Distributed client/server messaging for cross-agent coordination"
license = "MIT"
repository = "https://github.com/bolu-atx/chattrs"
keywords = ["agents", "messaging", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
gethostname = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

[profile.dist]
inherits = "release"
lto = "thin"
