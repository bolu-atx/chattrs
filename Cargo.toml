[package]
name = "chattrs"
version = "0.5.0"
edition = "2021"
description = "Distributed client/server messaging for cross-agent coordination"
license = "MIT"
repository = "https://github.com/bolu-atx/chattrs"
keywords = ["agents", "messaging", "cli"]
categories = ["command-line-utilities"]
exclude = ["tray"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
gethostname = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
socket2 = "0.6"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

[profile.dist]
inherits = "release"
lto = "thin"

[lints.clippy]
# Clippy has no cyclomatic lint. `cognitive_complexity` is its measure of
# branches and nesting per function. The limit is in `clippy.toml`.
cognitive_complexity = "deny"
